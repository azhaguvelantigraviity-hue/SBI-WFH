<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORGE INDIA — WFH Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Instrument Sans',sans-serif;transition:background .25s,color .25s;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{border-radius:99px}
input,select,textarea,button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ═══════════════════════════════════════════════════════════
// THEME SYSTEM
// ═══════════════════════════════════════════════════════════
const ThemeContext = createContext();

const themes = {
  dark: {
    name: 'dark',
    bg:        '#0D0D10',
    bg2:       '#131318',
    bg3:       '#1A1A22',
    bg4:       '#22222E',
    card:      '#16161F',
    cardBorder:'#252530',
    border:    '#252530',
    border2:   '#32323F',
    text:      '#F2F0FF',
    text2:     '#A09CB8',
    text3:     '#5E5A75',
    accent:    '#7B5EA7',
    accentL:   '#9B7DC7',
    accentGlow:'rgba(123,94,167,0.2)',
    green:     '#2ECC8F',
    greenBg:   'rgba(46,204,143,0.1)',
    red:       '#E85D75',
    redBg:     'rgba(232,93,117,0.1)',
    amber:     '#F0A500',
    amberBg:   'rgba(240,165,0,0.1)',
    blue:      '#4A9EFF',
    blueBg:    'rgba(74,158,255,0.1)',
    purple:    '#B06AFF',
    purpleBg:  'rgba(176,106,255,0.1)',
    teal:      '#2EC4B6',
    tealBg:    'rgba(46,196,182,0.1)',
    scrollThumb:'#32323F',
    shadow:    '0 8px 32px rgba(0,0,0,0.5)',
    shadowSm:  '0 2px 12px rgba(0,0,0,0.4)',
    inputBg:   '#1A1A22',
    sidebarW:  '256px',
  },
  light: {
    name: 'light',
    bg:        '#F7F6FC',
    bg2:       '#FFFFFF',
    bg3:       '#F0EEF8',
    bg4:       '#E8E5F5',
    card:      '#FFFFFF',
    cardBorder:'#E4E1F0',
    border:    '#E4E1F0',
    border2:   '#CCC9DE',
    text:      '#1A1828',
    text2:     '#5E5A75',
    text3:     '#9996B0',
    accent:    '#6B46C1',
    accentL:   '#7C3AED',
    accentGlow:'rgba(107,70,193,0.15)',
    green:     '#16A34A',
    greenBg:   'rgba(22,163,74,0.08)',
    red:       '#DC2626',
    redBg:     'rgba(220,38,38,0.08)',
    amber:     '#D97706',
    amberBg:   'rgba(217,119,6,0.08)',
    blue:      '#2563EB',
    blueBg:    'rgba(37,99,235,0.08)',
    purple:    '#7C3AED',
    purpleBg:  'rgba(124,58,237,0.08)',
    teal:      '#0D9488',
    tealBg:    'rgba(13,148,136,0.08)',
    scrollThumb:'#CCC9DE',
    shadow:    '0 4px 24px rgba(0,0,0,0.08)',
    shadowSm:  '0 2px 8px rgba(0,0,0,0.06)',
    inputBg:   '#F7F6FC',
    sidebarW:  '256px',
  }
};

function ThemeProvider({ children }) {
  const [theme, setTheme] = useState('dark');
  const t = themes[theme];

  useEffect(() => {
    document.body.style.background = t.bg;
    document.body.style.color = t.text;
    document.querySelector('::-webkit-scrollbar-thumb, style') &&
    Object.assign(document.documentElement.style, {
      '--scroll-thumb': t.scrollThumb,
    });
    const style = document.getElementById('dyn-scroll') || document.createElement('style');
    style.id = 'dyn-scroll';
    style.textContent = `::-webkit-scrollbar-thumb { background: ${t.scrollThumb}; }`;
    document.head.appendChild(style);
  }, [theme, t]);

  return (
    <ThemeContext.Provider value={{ theme, setTheme, t }}>
      {children}
    </ThemeContext.Provider>
  );
}

const useTheme = () => useContext(ThemeContext);

// ═══════════════════════════════════════════════════════════
// TOAST SYSTEM
// ═══════════════════════════════════════════════════════════
const ToastContext = createContext();

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((type, title, msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(p => [...p, { id, type, title, msg }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3800);
  }, []);
  return (
    <ToastContext.Provider value={{ add }}>
      {children}
      <ToastContainer toasts={toasts} onRemove={id => setToasts(p => p.filter(t => t.id !== id))} />
    </ToastContext.Provider>
  );
}

const useToast = () => useContext(ToastContext);

function ToastContainer({ toasts, onRemove }) {
  const { t } = useTheme();
  if (!toasts.length) return null;
  const icons = { success: '✓', error: '✕', info: 'i', warning: '⚠' };
  const colors = { success: t.green, error: t.red, info: t.blue, warning: t.amber };
  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:9999, display:'flex', flexDirection:'column', gap:8 }}>
      {toasts.map(toast => (
        <div key={toast.id} style={{
          background: t.card, border: `1px solid ${t.border2}`,
          borderLeft: `3px solid ${colors[toast.type]}`,
          borderRadius: 10, padding: '12px 16px', minWidth: 280, maxWidth: 360,
          boxShadow: t.shadow, display:'flex', gap:10, alignItems:'flex-start',
          animation: 'slideLeft .3s cubic-bezier(.16,1,.3,1)',
        }}>
          <div style={{
            width:22, height:22, borderRadius:'50%', background: colors[toast.type]+'22',
            color: colors[toast.type], display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:11, fontWeight:700, flexShrink:0, marginTop:1,
          }}>{icons[toast.type]}</div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:600, color:t.text }}>{toast.title}</div>
            {toast.msg && <div style={{ fontSize:12, color:t.text2, marginTop:2 }}>{toast.msg}</div>}
          </div>
          <button onClick={() => onRemove(toast.id)} style={{ background:'none', border:'none', color:t.text3, cursor:'pointer', fontSize:14, lineHeight:1 }}>×</button>
        </div>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// DESIGN PRIMITIVES
// ═══════════════════════════════════════════════════════════
function Card({ children, style, pad = 20, hover = false }) {
  const { t } = useTheme();
  const [hov, setHov] = useState(false);
  return (
    <div onMouseEnter={() => hover && setHov(true)} onMouseLeave={() => hover && setHov(false)} style={{
      background: t.card, border: `1px solid ${hov ? t.border2 : t.border}`,
      borderRadius: 14, padding: pad, transition: 'border-color .2s, transform .2s, box-shadow .2s',
      transform: hov ? 'translateY(-2px)' : 'none',
      boxShadow: hov ? t.shadow : 'none',
      ...style
    }}>{children}</div>
  );
}

function Button({ children, variant = 'primary', size = 'md', onClick, disabled, style, icon }) {
  const { t } = useTheme();
  const [hov, setHov] = useState(false);
  const sz = { sm: { py:6, px:12, fs:12 }, md: { py:8, px:16, fs:13 }, lg: { py:10, px:22, fs:14 } }[size];
  const vars = {
    primary: { bg: hov ? t.accentL : t.accent, color: '#fff', border: 'none', shadow: hov ? `0 4px 20px ${t.accentGlow}` : 'none' },
    ghost:   { bg: hov ? t.bg3 : 'transparent', color: t.text2, border: `1px solid ${t.border}`, shadow: 'none' },
    danger:  { bg: hov ? t.redBg+'60' : t.redBg, color: t.red, border: `1px solid ${t.red}30`, shadow: 'none' },
    success: { bg: hov ? t.greenBg+'60' : t.greenBg, color: t.green, border: `1px solid ${t.green}30`, shadow: 'none' },
    secondary:{ bg: hov ? t.bg4 : t.bg3, color: t.text2, border: `1px solid ${t.border}`, shadow: 'none' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        display:'inline-flex', alignItems:'center', gap:6,
        padding: `${sz.py}px ${sz.px}px`, fontSize: sz.fs, fontWeight:600,
        borderRadius:8, cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? .5 : 1,
        transition:'all .18s', fontFamily:'inherit', whiteSpace:'nowrap',
        ...vars, ...style
      }}>{icon && <span style={{fontSize:sz.fs+1}}>{icon}</span>}{children}</button>
  );
}

function Badge({ label, color = 'default' }) {
  const { t } = useTheme();
  const map = {
    new:         { bg: t.blueBg,   text: t.blue,   dot: t.blue },
    assigned:    { bg: t.purpleBg, text: t.purple,  dot: t.purple },
    in_progress: { bg: t.amberBg,  text: t.amber,   dot: t.amber },
    eligible:    { bg: t.greenBg,  text: t.green,   dot: t.green },
    not_eligible:{ bg: t.redBg,    text: t.red,     dot: t.red },
    qd_pending:  { bg: t.amberBg,  text: t.amber,   dot: t.amber },
    qd_submitted:{ bg: t.tealBg,   text: t.teal,    dot: t.teal },
    dispatched:  { bg: t.greenBg,  text: t.green,   dot: t.green },
    closed:      { bg: t.bg3,      text: t.text3,   dot: t.text3 },
    active:      { bg: t.greenBg,  text: t.green,   dot: t.green },
    suspended:   { bg: t.redBg,    text: t.red,     dot: t.red },
    salaried:    { bg: t.blueBg,   text: t.blue,    dot: t.blue },
    self_employed:{ bg: t.tealBg,  text: t.teal,    dot: t.teal },
    paid:        { bg: t.greenBg,  text: t.green,   dot: t.green },
    pending:     { bg: t.amberBg,  text: t.amber,   dot: t.amber },
    connected:   { bg: t.greenBg,  text: t.green,   dot: t.green },
    not_connected:{ bg: t.redBg,   text: t.red,     dot: t.red },
  };
  const c = map[color] || map[label?.toLowerCase()?.replace(' ','_')] || { bg: t.bg3, text: t.text3, dot: t.text3 };
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:5,
      background: c.bg, color: c.text,
      padding:'3px 9px', borderRadius:99, fontSize:11, fontWeight:600,
    }}>
      <span style={{ width:5, height:5, borderRadius:'50%', background:c.dot, flexShrink:0 }} />
      {label}
    </span>
  );
}

function Input({ label, value, onChange, placeholder, type='text', style, mono, required, hint }) {
  const { t } = useTheme();
  const [focused, setFocused] = useState(false);
  return (
    <div style={{ ...style }}>
      {label && <label style={{ display:'block', fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 }}>{label}{required && <span style={{color:t.red}}> *</span>}</label>}
      <input
        type={type} value={value} onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{
          width:'100%', background: t.inputBg, color: t.text,
          border: `1.5px solid ${focused ? t.accent : t.border}`,
          borderRadius:8, padding:'9px 12px', fontSize:13,
          fontFamily: mono ? "'JetBrains Mono', monospace" : 'inherit',
          outline:'none', transition:'border-color .18s',
          boxShadow: focused ? `0 0 0 3px ${t.accentGlow}` : 'none',
        }}
      />
      {hint && <div style={{ fontSize:11, color:t.text3, marginTop:4 }}>{hint}</div>}
    </div>
  );
}

function Select({ label, value, onChange, options, style }) {
  const { t } = useTheme();
  const [focused, setFocused] = useState(false);
  return (
    <div style={style}>
      {label && <label style={{ display:'block', fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 }}>{label}</label>}
      <select
        value={value} onChange={e => onChange(e.target.value)}
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{
          width:'100%', background: t.inputBg, color: t.text,
          border: `1.5px solid ${focused ? t.accent : t.border}`,
          borderRadius:8, padding:'9px 12px', fontSize:13, outline:'none',
          transition:'border-color .18s', cursor:'pointer',
          boxShadow: focused ? `0 0 0 3px ${t.accentGlow}` : 'none',
        }}
      >
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

function Stat({ label, value, delta, color = 'accent', icon }) {
  const { t } = useTheme();
  const clr = { accent: t.accent, green: t.green, red: t.red, amber: t.amber, blue: t.blue, teal: t.teal }[color] || t.accent;
  return (
    <Card hover style={{ position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', top:0, left:0, right:0, height:2, background: `linear-gradient(90deg, ${clr}, ${clr}66)` }} />
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.07em', marginBottom:10 }}>{label}</div>
          <div style={{ fontFamily:"'Fraunces', serif", fontSize:32, fontWeight:700, color:clr, lineHeight:1 }}>{value}</div>
          {delta && <div style={{ fontSize:11, color: delta.startsWith('+') ? t.green : t.red, marginTop:6, display:'flex', alignItems:'center', gap:3 }}>
            <span>{delta.startsWith('+') ? '↑' : '↓'}</span> {delta} vs last week
          </div>}
        </div>
        {icon && <div style={{ fontSize:28, opacity:.15 }}>{icon}</div>}
      </div>
    </Card>
  );
}

function Table({ columns, rows, onRowClick }) {
  const { t } = useTheme();
  const [hov, setHov] = useState(null);
  return (
    <div style={{ overflowX:'auto' }}>
      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
        <thead>
          <tr style={{ borderBottom:`2px solid ${t.border}` }}>
            {columns.map(c => (
              <th key={c.key} style={{ textAlign:'left', padding:'10px 14px', fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.07em', whiteSpace:'nowrap' }}>{c.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => (
            <tr key={i} onMouseEnter={() => setHov(i)} onMouseLeave={() => setHov(null)}
              onClick={() => onRowClick?.(row)}
              style={{ borderBottom:`1px solid ${t.border}`, background: hov===i ? t.bg3 : 'transparent', cursor: onRowClick ? 'pointer' : 'default', transition:'background .12s' }}>
              {columns.map(c => (
                <td key={c.key} style={{ padding:'11px 14px', verticalAlign:'middle', color: c.muted ? t.text3 : t.text }}>
                  {c.render ? c.render(row[c.key], row) : row[c.key]}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      {rows.length === 0 && (
        <div style={{ textAlign:'center', padding:'40px 20px', color:t.text3 }}>
          <div style={{ fontSize:28, marginBottom:8 }}>○</div>
          <div style={{ fontSize:13 }}>No records found</div>
        </div>
      )}
    </div>
  );
}

function Modal({ open, onClose, title, children, footer, width = 520 }) {
  const { t } = useTheme();
  if (!open) return null;
  return (
    <div onClick={e => e.target === e.currentTarget && onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.6)', backdropFilter:'blur(8px)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:200, padding:20,
      animation:'fadeIn .2s',
    }}>
      <div style={{
        background:t.card, border:`1px solid ${t.border2}`, borderRadius:16,
        width:'100%', maxWidth:width, maxHeight:'90vh', overflowY:'auto',
        boxShadow:'0 32px 80px rgba(0,0,0,.5)',
        animation:'slideUp .25s cubic-bezier(.16,1,.3,1)',
      }}>
        <div style={{ padding:'20px 24px 16px', borderBottom:`1px solid ${t.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ fontFamily:"'Fraunces', serif", fontSize:18, fontWeight:600, color:t.text }}>{title}</div>
          <button onClick={onClose} style={{ background:'none', border:'none', color:t.text3, cursor:'pointer', fontSize:20, lineHeight:1, borderRadius:4, padding:'2px 4px' }}>×</button>
        </div>
        <div style={{ padding:'20px 24px' }}>{children}</div>
        {footer && <div style={{ padding:'14px 24px', borderTop:`1px solid ${t.border}`, display:'flex', gap:8, justifyContent:'flex-end' }}>{footer}</div>}
      </div>
    </div>
  );
}

function Tabs({ tabs, active, onChange }) {
  const { t } = useTheme();
  return (
    <div style={{ display:'flex', gap:2, background:t.bg3, padding:3, borderRadius:10, width:'fit-content' }}>
      {tabs.map(tab => (
        <button key={tab.value} onClick={() => onChange(tab.value)} style={{
          padding:'7px 16px', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer', border:'none',
          background: active === tab.value ? (t.name === 'dark' ? t.card : '#fff') : 'transparent',
          color: active === tab.value ? t.text : t.text3,
          boxShadow: active === tab.value ? t.shadowSm : 'none',
          transition:'all .18s', whiteSpace:'nowrap',
        }}>{tab.label}</button>
      ))}
    </div>
  );
}

function ProgressBar({ value, color = 'accent', height = 5 }) {
  const { t } = useTheme();
  const clr = { accent: t.accent, green: t.green, amber: t.amber, red: t.red, blue: t.blue, teal: t.teal }[color] || t.accent;
  return (
    <div style={{ height, background:t.bg3, borderRadius:99, overflow:'hidden' }}>
      <div style={{ height:'100%', width:`${Math.min(100, value)}%`, background:clr, borderRadius:99, transition:'width .6s cubic-bezier(.16,1,.3,1)' }} />
    </div>
  );
}

function Avatar({ name, size = 36, colors: cs }) {
  const { t } = useTheme();
  const pairs = [
    [t.accent, t.accentL], [t.green, t.teal], [t.red, t.amber],
    [t.blue, t.purple], [t.teal, t.blue], [t.purple, t.red],
  ];
  const idx   = (name?.charCodeAt(0) || 0) % pairs.length;
  const [c1, c2] = cs || pairs[idx];
  const initials = name?.split(' ').map(n => n[0]).slice(0,2).join('') || '??';
  return (
    <div style={{
      width:size, height:size, borderRadius:'50%',
      background: `linear-gradient(135deg, ${c1}, ${c2})`,
      display:'flex', alignItems:'center', justifyContent:'center',
      fontSize: size * .34, fontWeight:700, color:'#fff', flexShrink:0,
      fontFamily:"'Fraunces', serif",
    }}>{initials}</div>
  );
}

function SectionHeader({ title, subtitle, action }) {
  const { t } = useTheme();
  return (
    <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:24 }}>
      <div>
        <h2 style={{ fontFamily:"'Fraunces', serif", fontSize:26, fontWeight:600, color:t.text, lineHeight:1.2 }}>{title}</h2>
        {subtitle && <p style={{ fontSize:13, color:t.text3, marginTop:5 }}>{subtitle}</p>}
      </div>
      {action}
    </div>
  );
}

function Divider() {
  const { t } = useTheme();
  return <div style={{ height:1, background:t.border, margin:'16px 0' }} />;
}

function InfoRow({ label, value, mono }) {
  const { t } = useTheme();
  return (
    <div style={{ display:'flex', alignItems:'center', padding:'9px 14px', background:t.bg3, borderRadius:8, marginBottom:6 }}>
      <div style={{ width:130, fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.06em', flexShrink:0 }}>{label}</div>
      <div style={{ flex:1, fontSize:13, color:t.text, fontFamily: mono ? "'JetBrains Mono', monospace" : 'inherit' }}>{value}</div>
    </div>
  );
}

// PAGE: UPLOAD DATASHEET
// ═══════════════════════════════════════════════════════════
function UploadPage() {
  const { t } = useTheme();
  const { add: toast } = useToast();
  const [dragging, setDragging] = useState(false);
  const [ocr, setOcr] = useState(null);
  const [engine, setEngine] = useState('tesseract');
  const [processing, setProcessing] = useState(false);
  const fileRef = useRef();

  const OCR_MOCK = [
    { name:'Raju Sharma', mobile:'9876501001', pincode:'600001' },
    { name:'Preethi K.',  mobile:'8765412001', pincode:'400001' },
    { name:'Sunil Mehta', mobile:'7654301001', pincode:'560001' },
    { name:'Kavitha R.',  mobile:'9543201001', pincode:'500001' },
    { name:'Balu T.',     mobile:'6789001001', pincode:'600002' },
  ];

  const handleFile = () => {
    setProcessing(true);
    toast('info', 'Processing…', 'Running OCR on uploaded file');
    setTimeout(() => { setOcr(OCR_MOCK); setProcessing(false); toast('success', 'OCR Complete', '5 records extracted'); }, 2000);
  };

  return (
    <div>
      <SectionHeader title="Upload Datasheet" subtitle="AI-powered OCR auto-extracts leads from images, PDFs, and Excel files" />

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <div>
          <Card style={{ marginBottom:16 }}>
            <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:14 }}>Upload File</div>
            <div
              onDragOver={e => { e.preventDefault(); setDragging(true); }}
              onDragLeave={() => setDragging(false)}
              onDrop={e => { e.preventDefault(); setDragging(false); handleFile(); }}
              onClick={() => fileRef.current?.click()}
              style={{
                border:`2px dashed ${dragging ? t.accent : t.border2}`,
                borderRadius:12, padding:'40px 20px', textAlign:'center', cursor:'pointer',
                background: dragging ? t.accentGlow : t.bg3,
                transition:'all .2s',
              }}
            >
              <div style={{ fontSize:32, marginBottom:10, opacity:.5 }}>⊞</div>
              <div style={{ fontSize:14, fontWeight:600, color:t.text2 }}>Click to upload or drag & drop</div>
              <div style={{ fontSize:12, color:t.text3, marginTop:6 }}>PDF, PNG, JPG, XLSX, CSV • Max 20MB</div>
              <input ref={fileRef} type="file" style={{ display:'none' }} onChange={handleFile} />
            </div>
            <div style={{ marginTop:16 }}>
              <div style={{ fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.06em', marginBottom:8 }}>OCR Engine</div>
              <div style={{ display:'flex', gap:8 }}>
                {[{v:'tesseract',l:'Tesseract'},{v:'google',l:'Google Vision'},{v:'aws',l:'AWS Textract'}].map(e => (
                  <button key={e.v} onClick={() => setEngine(e.v)} style={{
                    padding:'6px 12px', borderRadius:8, fontSize:11, fontWeight:600, cursor:'pointer',
                    border:`1.5px solid ${engine===e.v ? t.accent : t.border}`,
                    background: engine===e.v ? t.accentGlow : t.bg3,
                    color: engine===e.v ? t.accent : t.text3,
                    transition:'all .18s',
                  }}>{e.l}</button>
                ))}
              </div>
            </div>
          </Card>

          {processing && (
            <Card>
              <div style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 0' }}>
                <div style={{ width:20, height:20, borderRadius:'50%', border:`2px solid ${t.accent}`, borderTopColor:'transparent', animation:'spin 1s linear infinite' }} />
                <div style={{ fontSize:13, color:t.text2 }}>Running OCR engine…</div>
              </div>
            </Card>
          )}

          {ocr && !processing && (
            <Card>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
                <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text }}>Extracted Records</div>
                <Badge label={`${ocr.length} records`} color="eligible" />
              </div>
              {ocr.map((r, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', background:t.bg3, borderRadius:8, marginBottom:6 }}>
                  <Avatar name={r.name} size={28} />
                  <div style={{ flex:1, fontSize:12, fontWeight:600, color:t.text }}>{r.name}</div>
                  <div style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", color:t.text3 }}>{r.mobile}</div>
                  <div style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", color:t.text3 }}>{r.pincode}</div>
                  <div style={{ fontSize:12, cursor:'pointer', color:t.accent }}>✎</div>
                </div>
              ))}
              <div style={{ display:'flex', gap:8, marginTop:14 }}>
                <Button style={{ flex:1, justifyContent:'center' }} onClick={() => { setOcr(null); toast('success','Imported!','5 leads added to system'); }}>Import All Leads →</Button>
                <Button variant="ghost" onClick={() => setOcr(null)}>Discard</Button>
              </div>
            </Card>
          )}
        </div>

        <div>
          <Card style={{ marginBottom:16 }}>
            <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:14 }}>Import History</div>
            <Table
              columns={[
                { key:'file', label:'File' },
                { key:'records', label:'Records', render:v=><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>{v}</span> },
                { key:'status', label:'Status', render:v=><Badge label={v} color={v==='Imported'?'eligible':'in_progress'} /> },
                { key:'date', label:'Date', muted:true },
              ]}
              rows={[
                { file:'datasheet_june.xlsx', records:45, status:'Imported', date:'Today' },
                { file:'leads_may.pdf',        records:30, status:'Imported', date:'Yesterday' },
                { file:'scan_photo.jpg',       records:12, status:'Processing', date:'2 days ago' },
              ]}
            />
          </Card>
          <Card>
            <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:14 }}>Manual Add Lead</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <Input label="Customer Name" value="" onChange={() => {}} placeholder="Full name" style={{gridColumn:'1/-1'}} />
              <Input label="Mobile" value="" onChange={() => {}} placeholder="10-digit number" mono />
              <Input label="Pincode" value="" onChange={() => {}} placeholder="6-digit pincode" mono />
            </div>
            <Button style={{ marginTop:14 }} onClick={() => toast('success','Lead Added','Manual lead created')}>Add Lead</Button>
          </Card>
        </div>
      </div>
    </div>
  );
}

  const DUP_PANS   = ['ABCDE1234F','XYZAB5678G'];

  const runVerify = () => {
    if (!pan || !pincode) return;
    setLoading(true); setResult(null);
    setTimeout(() => {
      const panOk = /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan.toUpperCase()) && !DUP_PANS.includes(pan.toUpperCase());
      const pinOk = VALID_PINS.includes(pincode);
      setResult({ panOk, pinOk, eligible: panOk && pinOk });
      setLoading(false);
    }, 1200);
  };

  return (
    <div>
      <SectionHeader title="PAN & Pincode Verification" subtitle="Verify customer eligibility before QD submission" />
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
        <Card>
          <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:16 }}>Verify Customer</div>
          <Select label="Lead" value="l1" onChange={() => {}} options={SEED.leads.filter(l=>l.assigned_to==='u1').map(l=>({value:l.id,label:`${l.customer_name} — ${l.lead_number}`}))} style={{ marginBottom:12 }} />
          <Input label="PAN Number" value={pan} onChange={v => setPan(v.toUpperCase())} placeholder="ABCDE1234F" mono style={{ marginBottom:12 }} hint="Format: ABCDE1234F" />
          <Input label="Pincode"    value={pincode} onChange={setPincode} placeholder="600001" mono style={{ marginBottom:16 }} />
          <Button onClick={runVerify} disabled={loading || !pan || !pincode} style={{ width:'100%', justifyContent:'center' }}>
            {loading ? 'Verifying…' : '⊕ Verify Now'}
          </Button>

          {result && (
            <div style={{ marginTop:14 }}>
              {[
                { ok: result.panOk, okMsg:`PAN ${pan} is valid and unique`, failMsg:`PAN ${pan} already exists in system` },
                { ok: result.pinOk, okMsg:`Pincode ${pincode} is serviceable`, failMsg:`Pincode ${pincode} is not in serviceable list` },
              ].map((r, i) => (
                <div key={i} style={{ padding:'10px 14px', borderRadius:8, background: r.ok ? t.greenBg : t.redBg, border:`1px solid ${r.ok?t.green:t.red}30`, marginBottom:8, display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ color: r.ok ? t.green : t.red, fontSize:16 }}>{r.ok ? '✓' : '✕'}</span>
                  <span style={{ fontSize:13, color: r.ok ? t.green : t.red, fontWeight:500 }}>{r.ok ? r.okMsg : r.failMsg}</span>
                </div>
              ))}
              <div style={{ padding:'12px 14px', borderRadius:8, background: result.eligible ? t.greenBg : t.redBg, border:`1px solid ${result.eligible?t.green:t.red}30`, marginTop:4, textAlign:'center' }}>
                <div style={{ fontSize:14, fontWeight:700, color: result.eligible ? t.green : t.red }}>
                  {result.eligible ? '🎉 Customer Eligible — Proceed to QD Form' : '🚫 Customer Not Eligible — Lead Closed'}
                </div>
              </div>
            </div>
          )}
        </Card>

        <Card>
          <div style={{ fontFamily:"'Fraunces', serif", fontSize:16, fontWeight:600, color:t.text, marginBottom:14 }}>Verification Rules</div>
          {[
            { icon:'1', title:'PAN Validation', desc:'Format: ABCDE1234F. Checks if PAN already exists in the system database.' },
            { icon:'2', title:'Pincode Check',   desc:'Pincode must be in the serviceable whitelist configured by admin.' },
            { icon:'3', title:'Final Result',    desc:'Both must pass. If either fails, lead is automatically closed as Not Eligible.' },
          ].map((r, i, arr) => (
            <div key={i} style={{ display:'flex', gap:12, paddingBottom: i<arr.length-1 ? 14:0 }}>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                <div style={{ width:26, height:26, borderRadius:'50%', background:t.accentGlow, border:`1px solid ${t.accent}40`, color:t.accent, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, flexShrink:0 }}>{r.icon}</div>
                {i<arr.length-1 && <div style={{ width:1, flex:1, background:t.border, marginTop:4 }} />}
              </div>
              <div style={{ flex:1, paddingBottom: i<arr.length-1 ? 8:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color:t.text }}>{r.title}</div>
                <div style={{ fontSize:12, color:t.text3, marginTop:3, lineHeight:1.5 }}>{r.desc}</div>
              </div>
            </div>
          ))}
          <Divider />
          <div style={{ fontSize:11, fontWeight:600, color:t.text3, textTransform:'uppercase', letterSpacing:'.06em', marginBottom:8 }}>Serviceable Pincodes</div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
            {['600001','600002','400001','110001','500001','560001','682001'].map(p => (
              <span key={p} style={{ padding:'3px 8px', background:t.accentGlow, border:`1px solid ${t.accent}30`, borderRadius:5, fontSize:10, fontFamily:"'JetBrains Mono',monospace", color:t.accent }}>{p}</span>

function SPCallPage() {
  const { t } = useTheme();
  const { add: toast } = useToast();
  const [lead, setLead] = useState('');
  const [calling, setCalling] = useState(false);
  const [secs, setSecs] = useState(0);
  const timerRef = useRef(null);

  const leads = SEED.leads.filter(l => l.assigned_to === 'u1');
  const sel = leads.find(l => l.id === lead);

  const startCall = () => {
    setCalling(true); setSecs(0);
    timerRef.current = setInterval(() => setSecs(s => s+1), 1000);
    toast('info','Calling…','Connecting to customer');
  };
  const endCall = () => {
    clearInterval(timerRef.current); setCalling(false);
    toast('success','Call Ended',`Duration: ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`);
  };

  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div>
      <SectionHeader title="Call Customer" subtitle="Log calls and update lead status after connecting" />

                  <div style={{ fontFamily:"'JetBrains Mono', monospace", fontSize:13, color:t.text3, marginTop:4 }}>{sel.mobile}</div>
                  {calling && (
                    <div style={{ fontFamily:"'JetBrains Mono', monospace", fontSize:28, color:t.green, marginTop:12, fontWeight:700 }}>{fmt(secs)}</div>
                  )}
                  <div style={{ display:'flex', gap:10, justifyContent:'center', marginTop:16 }}>
                    {!calling
                      ? <Button onClick={startCall} icon="📞">Call Now</Button>

// LOGIN PAGE
// ═══════════════════════════════════════════════════════════
function LoginPage({ onLogin }) {
  const { t, theme, setTheme } = useTheme();
  const [loginRole, setLoginRole] = useState('admin');
  const [email, setEmail]         = useState('admin@salesforce.com');
  const [pass, setPass]           = useState('Admin@123');
  const [loading, setLoading]     = useState(false);

  const doLogin = () => {
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(loginRole); }, 900);
  };

  return (
    <div style={{ minHeight:'100vh', background:t.bg, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
      {/* Background gradient orbs */}
      <div style={{ position:'absolute', width:600, height:600, borderRadius:'50%', background:`radial-gradient(circle, ${t.accent}18 0%, transparent 70%)`, top:'10%', left:'5%', pointerEvents:'none' }} />
      <div style={{ position:'absolute', width:400, height:400, borderRadius:'50%', background:`radial-gradient(circle, ${t.green}10 0%, transparent 70%)`, bottom:'10%', right:'10%', pointerEvents:'none' }} />

      {/* Theme toggle */}
      <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} style={{
        position:'absolute', top:20, right:20, width:36, height:36, borderRadius:8,
        background:t.bg2, border:`1px solid ${t.border}`, cursor:'pointer',
        color:t.text2, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center',
      }}>{theme === 'dark' ? '☀' : '☾'}</button>

      <div style={{
        background: t.bg2, border:`1px solid ${t.border2}`, borderRadius:20,
        padding:'40px 36px', width:'100%', maxWidth:420,
        boxShadow:`0 32px 80px ${t.name==='dark'?'rgba(0,0,0,.6)':'rgba(0,0,0,.12)'}`,
        position:'relative', zIndex:1, animation:'slideUp .4s cubic-bezier(.16,1,.3,1)',
      }}>
        {/* Logo */}
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <div style={{ width:52, height:52, borderRadius:14, background:`linear-gradient(135deg, ${t.accent}, ${t.accentL})`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 14px' }}>
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
              <path d="M13 3L23 8.5V17.5L13 23L3 17.5V8.5L13 3Z" stroke="white" strokeWidth="2" fill="none"/>
              <circle cx="13" cy="13" r="3" fill="white"/>
            </svg>
          </div>
          <h1 style={{ fontFamily:"'Fraunces', serif", fontSize:24, fontWeight:700, color:t.text, letterSpacing:'-.01em' }}>SalesForce Pro</h1>
          <p style={{ fontSize:13, color:t.text3, marginTop:5 }}>WFH Sales Team Management Portal</p>
        </div>

        {/* Role selector */}
        <div style={{ display:'flex', gap:2, background:t.bg3, padding:3, borderRadius:10, marginBottom:22 }}>
          {['admin','sales'].map(role => (
            <button key={role} onClick={() => {
              setLoginRole(role);
              setEmail(role === 'admin' ? 'admin@salesforce.com' : 'arjun@salesforce.com');
              setPass(role === 'admin' ? 'Admin@123' : 'Sales@123');
            }} style={{
              flex:1, padding:'8px 0', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer', border:'none',
              background: loginRole === role ? (t.name === 'dark' ? t.card : '#fff') : 'transparent',
              color: loginRole === role ? t.text : t.text3,
              boxShadow: loginRole === role ? t.shadowSm : 'none',
              transition:'all .18s',
            }}>
              {role === 'admin' ? 'Admin' : 'Sales Person'}
            </button>
          ))}
        </div>

        <Input label="Email Address" value={email} onChange={setEmail} placeholder="you@company.com" type="email" style={{ marginBottom:12 }} />
        <Input label="Password"      value={pass}  onChange={setPass}  placeholder="••••••••"        type="password" style={{ marginBottom:6 }} />

        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20, marginTop:8 }}>
          <label style={{ display:'flex', alignItems:'center', gap:7, fontSize:12, color:t.text2, cursor:'pointer' }}>
            <input type="checkbox" defaultChecked style={{ accentColor:t.accent }} /> Remember me
          </label>
          <span style={{ fontSize:12, color:t.accent, cursor:'pointer', fontWeight:600 }}>Forgot password?</span>
        </div>

        <button onClick={doLogin} disabled={loading} style={{
          width:'100%', padding:'11px 0', borderRadius:10,
          background: `linear-gradient(135deg, ${t.accent}, ${t.accentL})`,
          color:'#fff', fontFamily:'inherit', fontSize:14, fontWeight:700,
          border:'none', cursor:'pointer', transition:'opacity .2s',
          opacity: loading ? .7 : 1, boxShadow:`0 4px 20px ${t.accentGlow}`,
        }}>{loading ? 'Signing in…' : 'Sign In →'}</button>

        <p style={{ textAlign:'center', fontSize:11, color:t.text3, marginTop:16 }}>
          Demo mode — any credentials work
        </p>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// PAGE TITLES
// ═══════════════════════════════════════════════════════════
const PAGE_TITLES = {
  'dashboard':'Dashboard','salespersons':'Sales Persons','leads':'Lead Management',
  'upload':'Upload Datasheet','assign':'Assign Leads','pipeline':'Pipeline View',
  'qd':'QD Management','reports':'Reports','incentives':'Incentives','calls':'Call Tracking','settings':'Settings',
  'sp-dashboard':'Dashboard','sp-leads':'My Leads','sp-call':'Call Customer',
  'sp-verify':'Verification','sp-qd':'QD Form','sp-docs':'Documents',
  'sp-incentives':'My Incentives','sp-profile':'My Profile',
};

// ═══════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════
function App() {
  const [auth, setAuth]   = useState(null); // { role, user }
  const [page, setPage]   = useState('dashboard');
  const { t } = useTheme();
  const { add: toast } = useToast();

  const USERS = {
    admin:  { name:'System Admin', role:'Administrator' },
    sales:  { name:'Arjun Kumar',  role:'Sales Person'  },
  };

  const handleLogin = (role) => {
    setAuth({ role, user: USERS[role] });
    setPage(role === 'admin' ? 'dashboard' : 'sp-dashboard');
    toast('success', 'Welcome back!', USERS[role].name);
  };

  const handleLogout = () => {
    setAuth(null);
    toast('info', 'Logged out', 'Session ended');
  };

  const goPage = (p) => setPage(p);

  if (!auth) return <LoginPage onLogin={handleLogin} />;

  const renderPage = () => {
    switch (page) {
      case 'dashboard':    return <AdminDashboard onNav={goPage} />;
      case 'salespersons': return <SalesPersonsPage />;
      case 'leads':        return <LeadsPage />;
      case 'upload':       return <UploadPage />;
      case 'assign':       return <AssignPage />;
      case 'pipeline':     return <PipelinePage />;
      case 'qd':           return <QDPage />;
      case 'reports':      return <ReportsPage />;
      case 'incentives':   return <IncentivesPage />;
      case 'calls':        return <CallsPage />;
      case 'settings':     return <SettingsPage />;
      case 'sp-dashboard': return <SPDashboard onNav={goPage} />;
      case 'sp-leads':     return <SPLeadsPage onNav={goPage} />;
      case 'sp-call':      return <SPCallPage />;
      case 'sp-verify':    return <SPVerifyPage />;
      case 'sp-qd':        return <SPQDForm />;
      case 'sp-docs':      return <SPDocsPage />;
      case 'sp-incentives':return <SPIncentivesPage />;
      case 'sp-profile':   return <SPProfilePage />;
      default: return <AdminDashboard onNav={goPage} />;
    }
  };

  return (
    <div style={{ display:'flex', minHeight:'100vh', background:t.bg }}>
      <Sidebar page={page} onPage={setPage} role={auth.role} user={auth.user} onLogout={handleLogout} />
      <div style={{ marginLeft: t.sidebarW, flex:1, display:'flex', flexDirection:'column', minHeight:'100vh', minWidth:0 }}>
        <Topbar title={PAGE_TITLES[page] || 'Dashboard'} user={auth.user} />
        <main style={{ flex:1, padding:28, overflowX:'hidden' }}>
          {renderPage()}
        </main>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// CSS ANIMATIONS
// ═══════════════════════════════════════════════════════════
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
  @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideLeft { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:translateX(0)} }
  @keyframes spin    { to{transform:rotate(360deg)} }
  @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.3} }
`;
document.head.appendChild(style);

ReactDOM.createRoot(document.getElementById('root')).render(
  <ThemeProvider>
    <ToastProvider>
      <App />
    </ToastProvider>
  </ThemeProvider>
);
</script>
</body>
</html>
